[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-routine-coach"
version = "0.5.0"
description = "An explainable, routine-aware weather decision assistant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
timezones = ["tzdata>=2024.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
